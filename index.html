<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>ADMOS Group — корпоративный мерч, дизайн, CRM, обучение</title>
<meta name="description" content="Группа компаний ADMOS: корпоративный мерч, дизайн, корпоративные мерчшопы, отраслевая CRM, обучение и агентский канал." />
<link rel="stylesheet" href="../../colors_and_type.css" />
<link rel="stylesheet" href="styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel">
const { useState } = React;

function App() {
  const [active, setActive] = useState('home');
  const handleNav = (id) => {
    setActive(id);
    if (id === 'home') {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    const el = document.getElementById(id);
    if (el) {
      const top = el.getBoundingClientRect().top + window.scrollY - 80;
      window.scrollTo({ top, behavior: 'smooth' });
    }
  };
  return (
    <div className="ag-app" data-screen-label="ADMOS Group — admos.ru">
      <Header active={active} onNav={handleNav} />
      <main>
        <Hero onNav={handleNav} />
        <GiftsSection />
        <DesignSection />
        <MerchshopSection />
        <ManifestoStrip />
        <TechSection />
        <EduSection />
        <SmbSection />
        <ContactsSection />
      </main>
      <Footer />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
