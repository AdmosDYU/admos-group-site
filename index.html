<meta name="description" content="Группа компаний ADMOS: корпоративный мерч, дизайн, корпоративные мерчшопы, отраслевая CRM, обучение и агентский канал." />
<style>
/* ============================================================
   ADMOS Group — Design Tokens
   Source: GUIDELINES_Admos_2023small (Brand Guideline 2024)
   ============================================================ */

/* ---------- WEBFONTS ----------
   Originals:  Gilroy (web body), Helios Extended Bold/Black (display)
   Substitutes (Google Fonts, both Cyrillic-capable):
     Helios Extended Bold/Black  →  Russo One   (heavy, wide, geometric)
     Gilroy Regular/Bold         →  Manrope     (geometric, near-identical metrics)
   ⚠️  Flagged: ask brand team for original .woff2 files to drop into /fonts.
*/
@import url("https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Russo+One&display=swap");

:root {
  /* ---------- BRAND CORE PALETTE ---------- */
  --admos-black:    #000000;   /* primary dark, primary type on light */
  --admos-white:    #FFFFFF;   /* primary light, type on dark */
  --admos-orange:   #FE5000;   /* dominant accent — "Оранжевое настроение" */
  --admos-blue:     #000F9F;   /* contrast — "Синий контраст" */
  --admos-green:    #93D500;   /* eco accent — "ЭКО Зелёный" */

  /* ---------- NEUTRALS (per guide: greys preferred 25–85% black) ---------- */
  --admos-grey-95:  #0D0D0D;
  --admos-grey-85:  #262626;
  --admos-grey-70:  #4D4D4D;
  --admos-grey-55:  #737373;
  --admos-grey-40:  #999999;
  --admos-grey-25:  #BFBFBF;
  --admos-grey-15:  #D9D9D9;
  --admos-grey-08:  #EBEBEB;
  --admos-grey-04:  #F5F5F5;

  /* ---------- SEMANTIC: SURFACE ---------- */
  --bg-default:        var(--admos-white);
  --bg-inverse:        var(--admos-black);
  --bg-accent:         var(--admos-orange);
  --bg-muted:          var(--admos-grey-04);
  --bg-section-dark:   var(--admos-black);
  --bg-section-light:  var(--admos-white);

  /* ---------- SEMANTIC: FOREGROUND ---------- */
  --fg-default:    var(--admos-black);
  --fg-secondary:  var(--admos-grey-70);
  --fg-muted:      var(--admos-grey-55);
  --fg-inverse:    var(--admos-white);
  --fg-accent:     var(--admos-orange);
  --fg-link:       var(--admos-orange);

  /* ---------- BORDERS ---------- */
  --border-default: var(--admos-black);
  --border-subtle:  var(--admos-grey-15);
  --border-strong:  var(--admos-black);

  /* ---------- TYPE FAMILIES ---------- */
  --font-display:    "Russo One", "Helios Extended", "Helvetica Neue", "Arial Black", sans-serif;
  --font-body:       "Manrope", "Gilroy", "Helvetica Neue", Arial, sans-serif;
  --font-pptx:       Arial, Helvetica, sans-serif;   /* per guide: pptx uses Arial */

  /* ---------- TYPE WEIGHTS ---------- */
  --fw-regular:  400;
  --fw-medium:   500;
  --fw-semibold: 600;
  --fw-bold:     700;
  --fw-black:    800;

  /* ---------- TYPE SCALE (web) ---------- */
  --fs-display-xl: 120px;  /* poster slogan */
  --fs-display-lg: 88px;   /* hero headline */
  --fs-display:    64px;   /* section headline */
  --fs-h1:         48px;
  --fs-h2:         36px;
  --fs-h3:         28px;
  --fs-h4:         22px;
  --fs-h5:         18px;
  --fs-body-lg:    18px;
  --fs-body:       16px;
  --fs-body-sm:    14px;
  --fs-caption:    12px;
  --fs-eyebrow:    13px;

  /* ---------- LINE HEIGHTS ---------- */
  --lh-tight:    0.95;   /* display caps */
  --lh-snug:     1.05;
  --lh-heading:  1.1;
  --lh-body:     1.5;
  --lh-loose:    1.65;

  /* ---------- LETTER SPACING ---------- */
  --ls-display: -0.01em;
  --ls-caps:    0.02em;
  --ls-eyebrow: 0.12em;

  /* ---------- SPACING (8pt-ish but with strong jumps) ---------- */
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  24px;
  --space-6:  32px;
  --space-7:  48px;
  --space-8:  64px;
  --space-9:  96px;
  --space-10: 128px;

  /* ---------- RADII (brand: sharp corners, near-zero) ---------- */
  --radius-0:  0px;        /* default. always */
  --radius-1:  2px;        /* used sparingly on tiny chips */
  --radius-pill: 999px;    /* only for chips / numeric tags */

  /* ---------- SAFE ZONE (per guide: L/16 of canvas) ---------- */
  --safe-zone-divisor: 16;

  /* ---------- ELEVATION (used very sparingly; brand is flat) ---------- */
  --shadow-0: none;
  --shadow-1: 0 1px 0 0 var(--admos-black);                /* hard underline */
  --shadow-2: 4px 4px 0 0 var(--admos-black);              /* offset hard shadow */
  --shadow-card-hover: 8px 8px 0 0 var(--admos-orange);    /* hover offset */

  /* ---------- MOTION ---------- */
  --ease-default: cubic-bezier(0.2, 0.0, 0.0, 1.0);
  --ease-out:     cubic-bezier(0.16, 1, 0.3, 1);
  --dur-fast:     120ms;
  --dur-base:     180ms;
  --dur-slow:     280ms;

  /* ---------- LAYOUT ---------- */
  --container-max: 1440px;
  --container-pad: 64px;
  --grid-gap:      24px;
}

/* ============================================================
   SEMANTIC TYPE STYLES
   Brand rule: headlines and article titles are ALL CAPS.
   Display family (Russo One / Helios Ext) is used for caps;
   Body family (Manrope / Gilroy) is used for paragraph + UI.
   ============================================================ */

.admos-display-xl,
.admos-display-lg,
.admos-display,
.admos-h1,
.admos-h2,
.admos-h3,
.admos-eyebrow {
  font-family: var(--font-display);
  font-weight: var(--fw-regular);   /* Russo One is single-weight; appears bold */
  text-transform: uppercase;
  letter-spacing: var(--ls-caps);
  line-height: var(--lh-tight);
  color: var(--fg-default);
}

.admos-display-xl { font-size: var(--fs-display-xl); line-height: var(--lh-tight); letter-spacing: var(--ls-display); }
.admos-display-lg { font-size: var(--fs-display-lg); line-height: var(--lh-tight); letter-spacing: var(--ls-display); }
.admos-display    { font-size: var(--fs-display);    line-height: var(--lh-snug); }
.admos-h1         { font-size: var(--fs-h1);         line-height: var(--lh-heading); }
.admos-h2         { font-size: var(--fs-h2);         line-height: var(--lh-heading); }
.admos-h3         { font-size: var(--fs-h3);         line-height: var(--lh-heading); }
.admos-h4         { font-size: var(--fs-h4);         line-height: var(--lh-heading); font-family: var(--font-body); font-weight: var(--fw-bold); text-transform: none; letter-spacing: 0; }
.admos-h5         { font-size: var(--fs-h5);         line-height: var(--lh-heading); font-family: var(--font-body); font-weight: var(--fw-bold); text-transform: none; letter-spacing: 0; }

.admos-eyebrow {
  font-size: var(--fs-eyebrow);
  letter-spacing: var(--ls-eyebrow);
  line-height: 1.2;
}

.admos-body-lg,
.admos-body,
.admos-body-sm,
.admos-caption,
.admos-subslogan {
  font-family: var(--font-body);
  color: var(--fg-default);
  text-transform: none;
  letter-spacing: 0;
  font-weight: var(--fw-regular);
}

.admos-body-lg   { font-size: var(--fs-body-lg); line-height: var(--lh-body); }
.admos-body      { font-size: var(--fs-body);    line-height: var(--lh-body); }
.admos-body-sm   { font-size: var(--fs-body-sm); line-height: var(--lh-body); }
.admos-caption   { font-size: var(--fs-caption); line-height: var(--lh-body); color: var(--fg-muted); }
.admos-subslogan { font-size: var(--fs-h4);      line-height: var(--lh-snug); font-weight: var(--fw-regular); }

/* ---------- Slogan + Subslogan paired block (per guide) ---------- */
.admos-slogan-block {
  display: grid;
  gap: var(--space-2);
}
.admos-slogan-block .slogan {
  font-family: var(--font-display);
  text-transform: uppercase;
  font-size: var(--fs-display);
  line-height: var(--lh-tight);
  letter-spacing: var(--ls-display);
}
.admos-slogan-block .subslogan {
  font-family: var(--font-body);
  font-weight: var(--fw-regular);
  font-size: var(--fs-h4);
  line-height: var(--lh-snug);
  text-transform: none;
}

/* ---------- Base reset for cards & demos ---------- */
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  font-family: var(--font-body);
  color: var(--fg-default);
  background: var(--bg-default);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

</style>
<style>
/* ============================================================
   ADMOS Group — Holding site (LIGHT scheme)
   Tokens come from ../../colors_and_type.css
   ============================================================ */

body { background: #fff; }

.ag-app { min-height: 100vh; background: #fff; }
.orange { color: #FE5000; }

/* ============================================================
   HEADER  (white, black text)
   ============================================================ */
.ag-header {
  height: 80px; padding: 0 48px;
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 48px;
  background: #fff; color: #000;
  position: sticky; top: 0; z-index: 100;
  border-bottom: 2px solid #000;
}
.ag-logo { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; }
.ag-logo img { height: 22px; }
/* invert removed — logo is the color version now */
.ag-logo img { height: 26px; }
.ag-logo-tag {
  font-family: var(--font-display); font-size: 10px; letter-spacing: .14em;
  padding: 3px 7px; background: #000; color: #fff;
}
.ag-nav { display: flex; justify-content: space-between; flex-wrap: nowrap; flex: 1; }
.ag-nav a {
  font-family: var(--font-display); font-size: 13px; text-transform: uppercase;
  letter-spacing: .06em; color: #000; text-decoration: none; padding: 6px 0;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
}
.ag-nav a:hover, .ag-nav a.is-active { border-bottom-color: #FE5000; color: #FE5000; }

/* ============================================================
   BUTTONS
   ============================================================ */
.ag-cta, .ag-btn {
  font-family: var(--font-display); text-transform: uppercase; letter-spacing: .08em;
  font-size: 13px; padding: 0 22px; height: 44px;
  display: inline-flex; align-items: center; gap: 10px;
  border: 2px solid #000; cursor: pointer; text-decoration: none;
  transition: all 180ms cubic-bezier(.16,1,.3,1);
}
.ag-cta { background: #FE5000; color: #000; border-color: #FE5000; }
.ag-cta:hover { background: #000; color: #fff; border-color: #000; transform: translate(-2px,-2px); box-shadow: 4px 4px 0 0 #FE5000; }

.ag-btn { height: 56px; font-size: 14px; padding: 0 28px; }
.ag-btn.primary { background: #FE5000; color: #000; border-color: #000; }
.ag-btn.primary:hover { background: #000; color: #fff; transform: translate(-3px,-3px); box-shadow: 6px 6px 0 0 #FE5000; }
.ag-btn.ghost { background: transparent; color: #000; border-color: #000; }
.ag-btn.ghost:hover { background: #000; color: #fff; }
.ag-btn.ghost-light { background: transparent; color: #fff; border-color: #fff; }
.ag-btn.ghost-light:hover { background: #fff; color: #000; }
.ag-btn.ghost-dark { background: transparent; color: #000; border-color: #000; }
.ag-btn.ghost-dark:hover { background: #000; color: #fff; }

/* ============================================================
   HERO  — black, stays dark
   ============================================================ */
.ag-hero {
  background: #fff; color: #000;
  padding: 88px 48px 64px;
  border-bottom: 2px solid #000;
}
.ag-hero-content { max-width: 1280px; margin: 0 auto; }
.ag-hero-eyebrow {
  font-family: var(--font-display); font-size: 13px; text-transform: uppercase;
  letter-spacing: .14em; color: #FE5000; margin-bottom: 32px;
}
.ag-hero-title {
  font-family: var(--font-display); text-transform: uppercase;
  font-size: clamp(44px, 6.2vw, 92px);
  line-height: .92; letter-spacing: -0.015em;
  margin: 0 0 32px; color: #000;
  max-width: 1200px;
}
.ag-hero-sub {
  font-family: var(--font-body); font-size: 20px; line-height: 1.4;
  max-width: 720px; color: #4D4D4D; margin: 0 0 56px;
}

/* Hero direction ticker — infinite auto-scroll */
.ag-hero-ticker-wrap {
  max-width: 100%; overflow: hidden;
  border-top: 2px solid #000; border-bottom: 2px solid #000;
}
.ag-hero-ticker {
  display: flex; width: max-content;
  animation: ag-hero-scroll 36s linear infinite;
}
@keyframes ag-hero-scroll {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}
.ag-hero-tile {
  position: relative;
  padding: 28px 24px; min-height: 200px; width: 280px;
  display: grid; grid-template-rows: 1fr auto auto;
  text-decoration: none;
  background: #fff; color: #000;
  border-right: 2px solid #000;
  transition: background 200ms ease, color 200ms ease;
  flex-shrink: 0; box-sizing: border-box;
}
.ag-hero-tile:last-child { border-right: 0; }
.ag-hero-tile.orange, .ag-hero-tile.white,
.ag-hero-tile.dark, .ag-hero-tile.green { /* all variants collapse to white */
  background: #fff; color: #000;
}
.ag-hero-tile .code {
  font-family: var(--font-display); font-size: 14px; letter-spacing: .12em;
  color: #FE5000;
}
.ag-hero-tile .name {
  font-family: var(--font-display); text-transform: uppercase;
  font-size: 20px; letter-spacing: -0.005em; line-height: 1.05; display: block;
  margin-bottom: 6px;
}
.ag-hero-tile .desc {
  font-family: var(--font-body); font-size: 13px; color: #4D4D4D; display: block;
}
.ag-hero-tile .arrow {
  position: absolute; top: 22px; right: 24px;
  font-family: var(--font-display); font-size: 22px; color: #000;
}
.ag-hero-tile:hover { background: #FE5000; color: #000; }
.ag-hero-tile:hover .code, .ag-hero-tile:hover .desc { color: #000; }

/* ============================================================
   STATS STRIP — white, sits below the hero black
   ============================================================ */
.ag-hero-bottom {
  background: #fff; color: #000;
  padding: 48px 48px;
  border-bottom: 2px solid #000;
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 0;
  max-width: 100%;
}
.ag-hero-bottom > .stat {
  display: flex; flex-direction: column; gap: 4px;
  padding: 0 28px;
  border-right: 1px solid #EBEBEB;
}
.ag-hero-bottom > .stat:first-child { padding-left: 0; }
.ag-hero-bottom > .stat:last-child  { border-right: 0; }
.ag-hero-bottom .stat .n {
  font-family: var(--font-display); text-transform: uppercase;
  font-size: 40px; letter-spacing: -0.01em; line-height: 1; color: #000;
}
.ag-hero-bottom .stat .l { font-family: var(--font-body); font-size: 12px; color: #737373; text-transform: uppercase; letter-spacing: .04em; }

/* ============================================================
   DIRECTION SECTIONS — all white now
   ============================================================ */
.ag-dir { padding: 112px 48px; border-bottom: 2px solid #000; background: #fff; color: #000; }
.ag-dir.light, .ag-dir.dark { background: #fff; color: #000; }

.ag-dir-grid {
  max-width: 1280px; margin: 0 auto;
  display: grid; grid-template-columns: 140px 1fr 280px; column-gap: 56px; row-gap: 32px;
}

.ag-dir-aside {
  display: flex; flex-direction: column; gap: 16px;
  padding-top: 6px;
}
.ag-dir-code {
  font-family: var(--font-display); text-transform: uppercase;
  font-size: 96px; line-height: .85; letter-spacing: -0.02em;
  color: #FE5000;
}
.ag-dir-url {
  font-family: var(--font-display); font-size: 13px; letter-spacing: .08em;
  text-transform: uppercase; color: #000;
  padding: 6px 10px; align-self: flex-start;
  border: 2px solid #000;
}

.ag-dir-eyebrow {
  font-family: var(--font-display); font-size: 12px; text-transform: uppercase;
  letter-spacing: .14em; color: #FE5000; margin-bottom: 20px;
}
.ag-dir-title {
  font-family: var(--font-display); text-transform: uppercase;
  font-size: clamp(36px, 4.4vw, 60px);
  line-height: .95; letter-spacing: -0.01em; margin: 0 0 24px;
  color: #000;
}
.ag-dir-lead {
  font-family: var(--font-body); font-size: 19px; line-height: 1.5;
  max-width: 720px; margin: 0 0 36px; color: #4D4D4D;
}

.ag-dir-bullets {
  list-style: none; padding: 0; margin: 0 0 36px;
  display: flex; flex-direction: column;
  border-top: 1px solid #000;
}
.ag-dir-bullets li {
  display: grid; grid-template-columns: 56px 1fr; gap: 20px; align-items: baseline;
  padding: 18px 0; border-bottom: 1px solid #EBEBEB;
  font-family: var(--font-body); font-size: 16px; line-height: 1.45; color: #000;
}
.ag-dir-bullets .num {
  font-family: var(--font-display); font-size: 14px; letter-spacing: .12em;
  color: #FE5000;
}

.ag-dir-actions { display: flex; gap: 12px; flex-wrap: wrap; }

.ag-dir-metrics {
  display: flex; flex-direction: column; gap: 12px;
  align-self: start;
}
.ag-dir-metric {
  padding: 22px 22px; border: 2px solid #000; min-height: 110px;
  display: flex; flex-direction: column; justify-content: space-between;
  background: #fff; color: #000;
}
.ag-dir-metric:first-child {
  /* leading metric stays orange-accent */
  background: #fff; border-color: #FE5000;
}
.ag-dir-metric:first-child .num { color: #FE5000; }
.ag-dir-metric .num {
  font-family: var(--font-display); font-size: 36px; line-height: 1;
  letter-spacing: -0.01em; color: #000;
}
.ag-dir-metric .lbl {
  font-family: var(--font-body); font-size: 12px;
  text-transform: uppercase; letter-spacing: .06em; color: #4D4D4D;
}

/* ============================================================
   MANIFESTO MARQUEE — switched from orange bg → white bg, orange dots
   ============================================================ */
.ag-strip {
  background: #fff; color: #000; padding: 20px 0;
  border-bottom: 2px solid #000; border-top: 2px solid #000; overflow: hidden;
}
.ag-strip-inner {
  display: flex; gap: 32px; align-items: center;
  font-family: var(--font-display); text-transform: uppercase;
  font-size: 28px; letter-spacing: .02em; white-space: nowrap;
  animation: ag-marquee 28s linear infinite;
  color: #000;
}
.ag-strip-inner .dot { width: 12px; height: 12px; background: #FE5000; flex-shrink: 0; }
@keyframes ag-marquee {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}

/* ============================================================
   CLIENTS — white
   ============================================================ */
.ag-section { padding: 96px 48px; background: #fff; }
.ag-clients { background: #fff; color: #000; border-bottom: 2px solid #000; }
.ag-section-head { max-width: 1280px; margin: 0 auto 48px; }
.ag-eyebrow {
  font-family: var(--font-display); font-size: 13px; text-transform: uppercase;
  letter-spacing: .12em; color: #FE5000; margin-bottom: 14px;
}
.ag-h2 {
  font-family: var(--font-display); text-transform: uppercase;
  font-size: clamp(36px, 4vw, 48px); line-height: .95; letter-spacing: -0.01em; margin: 0;
  color: #000;
}
.ag-h2.light { color: #000; }
.ag-clients-grid {
  max-width: 1280px; margin: 0 auto;
  display: grid; grid-template-columns: repeat(6, 1fr); gap: 0;
  border: 2px solid #000;
}
.ag-client-cell {
  font-family: var(--font-display); font-size: 18px; text-transform: uppercase;
  letter-spacing: .04em; padding: 36px 16px; text-align: center;
  border-right: 1px solid #EBEBEB; border-bottom: 1px solid #EBEBEB;
  color: #4D4D4D;
}
.ag-client-cell:nth-child(6n) { border-right: 0; }
.ag-client-cell:nth-last-child(-n+6) { border-bottom: 0; }
.ag-client-cell:hover { color: #FE5000; background: #F5F5F5; }

/* ============================================================
   CONTACTS — white
   ============================================================ */
.ag-stopper {
  background: #fff; color: #000; padding: 112px 48px; border-bottom: 2px solid #000;
}
.ag-stopper-grid {
  max-width: 1280px; margin: 0 auto;
  display: grid; grid-template-columns: 1.4fr 1fr; gap: 56px; align-items: start;
}
.ag-stopper-title {
  font-family: var(--font-display); text-transform: uppercase;
  font-size: clamp(44px, 5.2vw, 72px); line-height: .92; letter-spacing: -0.01em;
  margin: 0 0 24px; color: #000;
}
.ag-stopper p { font-family: var(--font-body); font-size: 18px; max-width: 560px; color: #4D4D4D; margin: 0 0 36px; }
.ag-stopper-actions { display: flex; gap: 12px; flex-wrap: wrap; }

.ag-contacts-card {
  border: 2px solid #000; background: #fff;
  display: flex; flex-direction: column;
}
.ag-contacts-card .row {
  display: grid; grid-template-columns: 110px 1fr; gap: 18px;
  padding: 18px 22px; border-bottom: 1px solid #EBEBEB;
}
.ag-contacts-card .row:last-child { border-bottom: 0; }
.ag-contacts-card .lbl {
  font-family: var(--font-display); font-size: 11px; letter-spacing: .12em;
  color: #FE5000;
}
.ag-contacts-card .val {
  font-family: var(--font-body); font-size: 15px; color: #000; line-height: 1.4;
}

/* ============================================================
   FOOTER — white
   ============================================================ */
.ag-footer { background: #fff; color: #000; padding: 64px 48px 24px; border-top: 2px solid #000; }
.ag-footer-top {
  max-width: 1280px; margin: 0 auto;
  display: grid; grid-template-columns: 1fr 2fr; gap: 64px;

function DirectionSection({ id, theme, code, eyebrow, title, titleAccent, lead, url, cta, bullets, metrics }) {
  return (
    <section id={id} className={`ag-dir ${theme}`}>
      <div className="ag-dir-grid">
        <aside className="ag-dir-aside">
          <div className="ag-dir-code">{code}</div>
          <div className="ag-dir-url">{url}</div>
        </aside>

        <div className="ag-dir-body">
          <div className="ag-dir-eyebrow">{eyebrow}</div>
          <h2 className="ag-dir-title">
            {title}
            {titleAccent && <><br/><span className="orange">{titleAccent}</span></>}
          </h2>
          <p className="ag-dir-lead">{lead}</p>

          <ul className="ag-dir-bullets">
            {bullets.map((b, i) => (
              <li key={i}>
                <span className="num">{String(i + 1).padStart(2, '0')}</span>
                <span>{b}</span>
              </li>
            ))}
          </ul>

          <div className="ag-dir-actions">
            <a className="ag-btn primary" href="#">{cta} <span>→</span></a>
            <a className="ag-btn ghost" href="#">Открыть сайт</a>
          </div>
        </div>

        <div className="ag-dir-metrics">
          {metrics.map((m, i) => (
            <div key={i} className="ag-dir-metric">
              <span className="num">{m.value}</span>
              <span className="lbl">{m.label}</span>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

<script type="text/babel">
const { useState } = React;

function App() {
  const [active, setActive] = useState('home');
  const handleNav = (id) => {
    setActive(id);
    if (id === 'home') {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    const el = document.getElementById(id);
    if (el) {
      const top = el.getBoundingClientRect().top + window.scrollY - 80;
      window.scrollTo({ top, behavior: 'smooth' });
    }
  };
  return (
    <div className="ag-app" data-screen-label="ADMOS Group — admos.ru">
      <Header active={active} onNav={handleNav} />
      <main>
        <Hero onNav={handleNav} />
        <GiftsSection />
        <DesignSection />
        <MerchshopSection />
        <ManifestoStrip />
        <TechSection />
        <EduSection />
        <SmbSection />
        <ContactsSection />
      </main>
      <Footer />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
